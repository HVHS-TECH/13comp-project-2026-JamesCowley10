<!DOCTYPE html>
<html lang="en">

<head>
  <title>Guess The Number</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- STYLESHEETS *******************************************-->
  <link rel="stylesheet" href="../game/css/style.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- JQUERY ************************************************-->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <!-- FIREBASE START ****************************************-->
  <link type="text/css" rel="stylesheet" href="https://cdn.firebase.com/libs/firebaseui/3.5.2/firebaseui.css" />
  <!-- FIREBASE END ******************************************-->

</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <script type="module" src="../game/gtnGame.mjs"></script>

  <!-- HTML FOR WAITING FOR ENOUGH PLAYERS -->
  <div id="waitingDiv">
    <h1 id="mainTitle">Waiting for another player..</h1>
    <div id="profileImgs">
      <div class="playerContainer" id="player1">
        <h2 class="playerName" id="player1Name">Waiting...</h2>
        <img class="profileImg" id="player1ProfileImgWaiting" src="../../../assets/pfpPlaceholder.jpg">
      </div>
      <div class="playerContainer" id="player2">
        <h2 class="playerName" id="player2Name">Waiting...</h2>
        <img class="profileImg" id="player2ProfileImgWaiting" src="../../../assets/pfpPlaceholder.jpg">
      </div>
    </div>

    <div id="gameButtons">
      <button id="leaveGameButtonWaiting">Leave Game</button><br>
    </div>
  </div>
  <!-- END OF HTML FOR WAITING FOR ENOUGH PLAYERS -->

  <!-- HTML FOR GAME -->
  <div hidden="true" id="gameDiv">
    <h1 id="mainTitleGame">Player 1's Turn</h1>
    <div id="profileImgs">
      <div class="playerContainer" id="player1">
        <h2 class="playerName" id="player1NameGame">Player 1</h2>
        <h2 class="playerStatus" id="player1Status">Guessing...</h2>
        <img class="profileImg" id="player1ProfileImgGame" src="../../../assets/pfpPlaceholder.jpg">
      </div>
      <h1 id="vsText">VS</h1>
      <div class="playerContainer" id="player2">
        <h2 class="playerName" id="player2NameGame">Player 2</h2>
        <h2 class="playerStatus" id="player2Status">Waiting...</h2>
        <img class="profileImg" id="player2ProfileImgGame" src="../../../assets/pfpPlaceholder.jpg">
      </div>
    </div>

    <div id="gameButtons">
      <div id="guessDiv">
        <button id="lowerGuessButton">◀</button>
        <h2 id="guessNumber">50</h2>
        <button id="higherGuessButton">▶</button>
      </div>
      <button id="guessButton">Guess</button><br>
      <button id="leaveGameButtonGame">Leave Game</button><br>
    </div>
  </div>

</body>

</html>
<!--*************************************************************
  END OF gtnGame.HTML
**************************************************************-->
